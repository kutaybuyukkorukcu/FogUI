services:
  backend:
    build:
      context: .
      dockerfile: apps/be-transform-showcase/Dockerfile
    container_name: fogui-backend
    ports:
      - "8080:5001"
    environment:
      # OpenAI-Compatible Provider (Groq, OpenRouter, OpenAI, etc.)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Keep non-empty by default so Spring AI does not fail-fast at startup.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-local-dev-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.3-70b-versatile}
    networks:
      - fogui-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: apps/fe-transform-showcase/Dockerfile
    container_name: fogui-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fogui-network
    environment:
      - NODE_ENV=production

networks:
  fogui-network:
    driver: bridge
