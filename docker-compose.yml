services:
  db:
    image: postgres:16-alpine
    container_name: fogui-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fogui}
      - POSTGRES_USER=${POSTGRES_USER:-fogui}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fogui_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - genui-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fogui -d fogui" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: genui-backend
    ports:
      - "5001:5001"
    environment:
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/fogui}
      - DATABASE_USER=${DATABASE_USER:-fogui}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-fogui_secret}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      # LLM Provider Selection
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      # OpenAI-Compatible Provider (Groq, OpenRouter, OpenAI, etc.)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.3-70b-versatile}
      # Google Gemini Provider
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GOOGLE_AI_MODEL=${GOOGLE_AI_MODEL:-gemini-2.5-flash}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - genui-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: genui-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - genui-network
    environment:
      - NODE_ENV=production

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5001}
    container_name: fogui-dashboard
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - genui-network
    environment:
      - NODE_ENV=production

networks:
  genui-network:
    driver: bridge

volumes:
  postgres_data:


