services:
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: genui-backend
    ports:
      - "5001:5001"
    environment:
      # LLM Configuration (from .env)
      - GENUI_PROVIDER=${GENUI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
    networks:
      - genui-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: genui-frontend
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - genui-network
    environment:
      - NODE_ENV=production

networks:
  genui-network:
    driver: bridge
