services:
  db:
    image: postgres:16-alpine
    container_name: fogui-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fogui}
      - POSTGRES_USER=${POSTGRES_USER:-fogui}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fogui_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fogui-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fogui -d fogui" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    container_name: fogui-backend
    ports:
      - "8080:5001"
    environment:
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/fogui}
      - DATABASE_USER=${DATABASE_USER:-fogui}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-fogui_secret}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      # LLM Provider Selection
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      # OpenAI-Compatible Provider (Groq, OpenRouter, OpenAI, etc.)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Keep non-empty by default so Spring AI does not fail-fast at startup.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-local-dev-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.3-70b-versatile}
      # Google Gemini Provider
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GOOGLE_AI_MODEL=${GOOGLE_AI_MODEL:-gemini-2.5-flash}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fogui-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: examples/react-demo/Dockerfile
    container_name: fogui-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fogui-network
    environment:
      - NODE_ENV=production

networks:
  fogui-network:
    driver: bridge

volumes:
  postgres_data:
