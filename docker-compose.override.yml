# Development overrides - hot reload for both backend and frontend
services:
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile.dev
    ports:
      - "5001:5001"
      - "5005:5005" # Debug port
    volumes:
      # Mount source for hot reload
      - ./backend-java/src:/app/src
      - ./backend-java/pom.xml:/app/pom.xml
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GENUI_PROVIDER=${GENUI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4o-mini}
      - LOGGING_LEVEL_COM_GENUI=DEBUG

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DOCKER_CONTAINER=true
      - VITE_API_URL=http://localhost:5001
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]
