# Development overrides - hot reload for both backend and frontend
services:
  backend:
    build:
      context: .
      dockerfile: backend-java/Dockerfile.dev
    ports:
      - "5001:5001"
      - "5005:5005" # Debug port
    volumes:
      # Mount reactor + module sources for hot reload
      - ./pom.xml:/workspace/pom.xml
      - ./backend-java/src:/workspace/backend-java/src
      - ./backend-java/pom.xml:/workspace/backend-java/pom.xml
      - ./fogui-java-core/src:/workspace/fogui-java-core/src
      - ./fogui-java-core/pom.xml:/workspace/fogui-java-core/pom.xml
      - ./fogui-spring-starter/src:/workspace/fogui-spring-starter/src
      - ./fogui-spring-starter/pom.xml:/workspace/fogui-spring-starter/pom.xml
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GENUI_PROVIDER=${GENUI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGGING_LEVEL_COM_GENUI=DEBUG

  frontend:
    build:
      context: ./examples/react-demo
      dockerfile: Dockerfile.dev
    volumes:
      - ./examples/react-demo:/app
      - ./packages/react:/packages/react
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DOCKER_CONTAINER=true
      - VITE_API_URL=http://localhost:5001
    command: [ "sh", "-c", "rm -rf node_modules/* node_modules/.[!.]* 2>/dev/null || true; npm install --no-package-lock --no-audit --no-fund && npm run dev -- --host 0.0.0.0" ]
