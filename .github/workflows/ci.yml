name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ================================
  # Backend Java Build & Test
  # ================================
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/be-transform-showcase

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Test & Generate Coverage
        run: ./mvnw -f ../../pom.xml -pl apps/be-transform-showcase -am test

      - name: Deterministic Conformance and Replay Suites
        run: ./mvnw -f ../../pom.xml -pl :fogui-java-core test -Dtest=CanonicalConformanceFixtureTest,StreamReplayDeterminismTest

      - name: Package with Sentry source context upload
        run: |
          ./mvnw -B -f ../../pom.xml -pl apps/be-transform-showcase -am package -DskipTests dependency:copy-dependencies \
            -Dsentry.org=${{ secrets.SENTRY_ORG }} \
            -Dsentry.project=${{ secrets.SENTRY_PROJECT_BACKEND }} \
            -Dsentry.authToken=${{ secrets.SENTRY_AUTH_TOKEN }} \
            -Dsentry.skip=false
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-build
          path: |
            packages/fogui-java-core/target
            packages/fogui-spring-boot-starter/target
            packages/fogui-spring-web-starter/target
            apps/be-transform-showcase/target
          retention-days: 1

  # ================================
  # Frontend React Package
  # ================================
  frontend-package:
    name: Frontend Package (@fogui/react)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/react

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Build package
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: packages/react/coverage
          retention-days: 1
        if: always()

  # ================================
  # SonarCloud Analysis
  # ================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend-package]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: .

      - name: Verify Java analysis and coverage inputs exist
        run: |
          test -d packages/fogui-java-core/target/classes
          test -d packages/fogui-spring-boot-starter/target/classes
          test -d packages/fogui-spring-web-starter/target/classes
          test -d apps/be-transform-showcase/target/classes
          test -f packages/fogui-java-core/target/site/jacoco/jacoco.xml
          test -f packages/fogui-spring-boot-starter/target/site/jacoco/jacoco.xml
          test -f packages/fogui-spring-web-starter/target/site/jacoco/jacoco.xml
          test -f apps/be-transform-showcase/target/site/jacoco/jacoco.xml
          ls -la packages/fogui-java-core/target | head
          ls -la packages/fogui-spring-boot-starter/target | head
          ls -la packages/fogui-spring-web-starter/target | head
          ls -la apps/be-transform-showcase/target | head
          ls -la packages/fogui-java-core/target/site/jacoco | head
          ls -la packages/fogui-spring-boot-starter/target/site/jacoco | head
          ls -la packages/fogui-spring-web-starter/target/site/jacoco | head
          ls -la apps/be-transform-showcase/target/site/jacoco | head

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: packages/react/coverage

      - name: Verify frontend LCOV exists
        run: |
          ls -la packages/react/coverage
          test -f packages/react/coverage/lcov.info
          head -n 20 packages/react/coverage/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
