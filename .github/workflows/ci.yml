name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ================================
  # Backend Java Build & Test
  # ================================
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Test & Generate Coverage
        run: ./mvnw -f ../pom.xml -pl backend-java -am test

      - name: Package with Sentry source context upload
        run: |
          ./mvnw -B -f ../pom.xml -pl backend-java -am package -DskipTests dependency:copy-dependencies \
            -Dsentry.org=${{ secrets.SENTRY_ORG }} \
            -Dsentry.project=${{ secrets.SENTRY_PROJECT_BACKEND }} \
            -Dsentry.authToken=${{ secrets.SENTRY_AUTH_TOKEN }} \
            -Dsentry.skip=false
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-build
          path: |
            backend-java/target/classes
            backend-java/target/test-classes
            backend-java/target/site/jacoco
            backend-java/target/surefire-reports
            backend-java/target/dependency
          retention-days: 1

  # ================================
  # Frontend React Package
  # ================================
  frontend-package:
    name: Frontend Package (@fogui/react)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/react

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Build package
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: packages/react/coverage
          retention-days: 1
        if: always()

  # ================================
  # Minimal React Demo Smoke
  # ================================
  react-demo-smoke:
    name: React Demo Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./examples/react-demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/react-demo/package-lock.json

      - name: Build local React package (demo dependency)
        working-directory: ./packages/react
        run: |
          npm ci
          npm run build

      - name: Install demo dependencies
        run: npm ci

      - name: Demo build smoke
        run: npm run build

  # ================================
  # SonarCloud Analysis
  # ================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend-package, react-demo-smoke]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-java/target

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: packages/react/coverage

      - name: Verify frontend LCOV exists
        run: |
          ls -la packages/react/coverage
          test -f packages/react/coverage/lcov.info
          head -n 20 packages/react/coverage/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
