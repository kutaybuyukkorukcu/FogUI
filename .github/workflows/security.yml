name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'  # Weekly scan on Monday at midnight

jobs:
  # ================================
  # Snyk - Java Dependencies
  # ================================
  snyk-java:
    name: Snyk (Java Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true  # Don't block PR, report only (change to false to enforce)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend-java/pom.xml

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # ================================
  # Snyk - Node.js Dependencies (React Package)
  # ================================
  snyk-node-package:
    name: Snyk (React Package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=packages/react/package.json

  # ================================
  # Snyk - Node.js Dependencies (Dashboard)
  # ================================
  snyk-node-dashboard:
    name: Snyk (Dashboard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=dashboard/package.json

  # ================================
  # Snyk - Docker Container Scan
  # ================================
  snyk-container:
    name: Snyk (Container)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for Docker
        run: ./mvnw -B package -DskipTests
        working-directory: ./backend-java

      - name: Build Docker image for scanning
        run: docker build -t fogui-backend:scan ./backend-java

      - name: Run Snyk Container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: fogui-backend:scan
          args: --severity-threshold=high

  # ================================
  # Security Summary
  # ================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [snyk-java, snyk-node-package, snyk-node-dashboard]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Java Dependencies | ${{ needs.snyk-java.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| React Package | ${{ needs.snyk-node-package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ needs.snyk-node-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the Snyk dashboard: https://app.snyk.io" >> $GITHUB_STEP_SUMMARY
