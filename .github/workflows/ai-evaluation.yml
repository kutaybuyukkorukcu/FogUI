name: AI Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  evaluation:
    name: Spring AI Evaluations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/be-transform-showcase

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run deterministic evaluator suite
        run: ./mvnw -B -f ../../pom.xml -pl apps/be-transform-showcase -am test -Dtest=ModelEvaluationSuite -Dsurefire.failIfNoSpecifiedTests=false

