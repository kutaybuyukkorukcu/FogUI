name: NPM Publish

on:
  push:
    tags:
      - 'v*.*.*'

# Required for OIDC trusted publishing
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/react

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/react/package-lock.json

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Uses OIDC trusted publishing - configure on npmjs.com first!
      - name: Publish to NPM
        run: npm publish --access public --provenance

      - name: Generate publish summary
        run: |
          echo "## 📦 NPM Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`@fogui/react\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔐 Published using OIDC Trusted Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @fogui/react" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
