name: Java Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (for example 1.0.0 or 1.0.0-rc1)'
        required: true
        type: string
  push:
    tags:
      - 'java-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish-java-modules:
    name: Publish Java Modules to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#java-v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid Java release version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify fogui-java-core, fogui-spring-starter, and fogui-spring-web-starter
        run: |
          mvn -B -f pom.xml \
            -Drevision=${{ steps.release-version.outputs.value }} \
            -pl .,:fogui-java-core,:fogui-spring-starter,:fogui-spring-web-starter \
            -am verify

      - name: Publish fogui-java-core, fogui-spring-starter, and fogui-spring-web-starter
        run: |
          mvn -B -f pom.xml \
            -Drevision=${{ steps.release-version.outputs.value }} \
            -pl .,:fogui-java-core,:fogui-spring-starter,:fogui-spring-web-starter \
            -am deploy -DskipTests -DdeployAtEnd=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          echo "## Java Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.release-version.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "Repository: https://github.com/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "Registry: https://maven.pkg.github.com/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "Published modules:" >> $GITHUB_STEP_SUMMARY
          echo "- com.fogui:fogui-java-core" >> $GITHUB_STEP_SUMMARY
          echo "- com.fogui:fogui-spring-starter" >> $GITHUB_STEP_SUMMARY
          echo "- com.fogui:fogui-spring-web-starter" >> $GITHUB_STEP_SUMMARY
