server:
  port: 5001

spring:
  application:
    name: genui-backend
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fogui}
    username: ${DATABASE_USER:fogui}
    password: ${DATABASE_PASSWORD:fogui_secret}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring AI - Vertex AI Gemini (Primary LLM)
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GOOGLE_CLOUD_PROJECT:}
          location: ${GOOGLE_CLOUD_LOCATION:us-central1}
          model: ${GOOGLE_AI_MODEL:gemini-2.5-flash-lite}
          chat:
            options:
              temperature: 0.7

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-min-32-chars}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

# Logging
logging:
  level:
    com.genui: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.security: DEBUG
