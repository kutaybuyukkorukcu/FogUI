server:
  port: 5001

spring:
  application:
    name: genui-backend
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fogui}
    username: ${DATABASE_USER:fogui}
    password: ${DATABASE_PASSWORD:fogui_secret}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring AI Configuration
  # Set AI_PROVIDER to 'openai' (for Groq/OpenRouter/OpenAI) or 'gemini' (for Google AI Studio)
  ai:
    # OpenAI-compatible provider (Groq, OpenRouter, OpenAI, etc.)
    openai:
      api-key: ${OPENAI_API_KEY:${GROQ_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${OPENAI_MODEL:llama-3.3-70b-versatile}
          temperature: 0.7
    # Google AI Studio (Gemini)
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY:}
        chat:
          options:
            model: ${GOOGLE_AI_MODEL:gemini-2.5-flash}
            temperature: 0.7

# FogUI Configuration
fogui:
  ai:
    provider: ${AI_PROVIDER:openai}  # 'openai' or 'gemini'

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-min-32-chars}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

# Logging
logging:
  level:
    com.genui: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.security: DEBUG
