server:
  port: 5001

spring:
  application:
    name: genui-backend
  
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:}
        endpoint: ${AZURE_OPENAI_ENDPOINT:}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini}
            temperature: 0.7

# GenUI configuration
genui:
  default-provider: ${GENUI_PROVIDER:openai}
  transform:
    model: ${GENUI_TRANSFORM_MODEL:gpt-4o-mini}

# Logging
logging:
  level:
    com.genui: DEBUG
    org.springframework.ai: DEBUG
